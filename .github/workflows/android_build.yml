name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA-MAZENGALAB-SANAA-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release (On Main Branch Push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "GTA MAZENGALAB SANAA v1.0.${{ github.run_number }}"
          body: |
            ## 🎮 تحديث وتوليد تلقائي لتطبيق GTA MAZENGALAB SANAA
            - بناء تلقائي عبر GitHub Actions.
            - تم تضمين كامل ميزات مطاردات أزقة صنعاء 7D، استرداد السيارات، ونظام الصوتيات والمؤثرات التراثية.
            - قم بتحميل ملف الـ APK المرفق بالأسفل وتثبيته مباشرة على هاتفك الأندرويد.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
